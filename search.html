<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Search</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <nav>
      <img src="media/powpow logo.jpg" alt="Student Life Management Services logo" style="height:48px; width:auto; display:block;" >
      <h2>Student Life Management Services</h2>


      <form id="navSearch" class="nav-search" role="search" aria-label="Site search" onsubmit="return false;">
        <input id="navSearchInput" type="search" placeholder="Search..." aria-label="Search keywords" />
        <button id="navSearchBtn" type="button">Search</button>
      </form>

      <ul>
        <li><a href="service.html">Services</a></li>
        <li><a href="enquiry.html">Pricing</a></li>
        <li><a href="about.html">Motivation</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>


  <main class="enquiry-page" style='background-image: url("media/mint.jpg");'>
    <div class="enquiry-page__overlay" aria-hidden="true"></div>

    <div class="enquiry-page__content">
      <h1 style="margin-bottom: 1.5rem;">Search</h1>

      <div class="card" style="max-width: 820px; margin: 0 auto;">
        <label for="searchInput" style="display:block; font-weight:800; color: var(--color-primary); margin-bottom: .5rem; text-transform: uppercase;">Search the website</label>
        <input id="searchInput" type="search" placeholder="Type keywords (e.g. tutoring, pricing, contact)" style="width:100%; padding: 0.9rem 1rem; border-radius: 10px; border: 2px solid var(--color-border);" />

        <div style="display:flex; gap: .75rem; flex-wrap: wrap; margin-top: 1rem;">
          <button id="searchBtn" type="button" style="background: var(--color-primary); color: #fff; border:none; padding: .7rem 1.2rem; border-radius: 10px; font-weight:800; cursor:pointer;">Search</button>
          <button id="clearBtn" type="button" style="background: transparent; color: var(--color-secondary); border: 2px solid var(--color-secondary); padding: .7rem 1.2rem; border-radius: 10px; font-weight:800; cursor:pointer;">Clear</button>
        </div>
      </div>

      <section class="card" style="max-width: 820px; margin-top: var(--space-xl);" aria-live="polite">
        <h2 style="margin-top:0;">Results</h2>
        <div id="results" style="color: var(--color-text-light);">
          Start typing and click <b>Search</b>.
        </div>
      </section>

      <div style="max-width: 820px; margin: var(--space-lg) auto 0;">
        <a href="index.html" class="a-pill" style="display:inline-flex;">Back Home</a>
      </div>
    </div>
  </main>

  <footer>
    <p>2026 Student Life Management Services</p>
  </footer>

  <script>
    
    const INDEX = [
      { page: 'index.html', title: 'Unlock Your Academic Potential', keywords: ['mission','discipline','academics','potential','students'] },
      { page: 'service.html', title: 'Our Services', keywords: ['services','tutoring','programming','networking','finance','law','commerce'] },
      { page: 'enquiry.html', title: 'Enquiry / Pricing', keywords: ['pricing','plans','monthly','yearly','starter','standard','premium','payment'] },
      { page: 'about.html', title: 'Stay Disciplined', keywords: ['motivation','discipline','success tips','encouragement'] },
      { page: 'contact.html', title: 'Contact Us', keywords: ['contact','email','phone','location','support','feedback'] }
    ];

    const input = document.getElementById('searchInput');
    const btn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');
    const results = document.getElementById('results');

    function normalize(s){
      return (s || '').toLowerCase().trim();
    }

    function render(matches, q) {
      if (!q) {
        results.innerHTML = 'Start typing and click <b>Search</b>.';
        return;
      }
      if (!matches.length) {
        results.innerHTML = `No results found for <b>${q}</b>.`;
        return;
      }

      results.innerHTML = matches
        .map(m => {
          return `
            <div style="padding:.75rem 0; border-bottom:1px solid rgba(0,0,0,.08);">
              <a href="${m.page}" style="font-weight:900; color: var(--color-secondary);">${m.title}</a>
              <div style="margin-top:.25rem; font-size:.95rem; color: var(--color-text-light);">Matched: ${m.matched.join(', ')}</div>
            </div>
          `;
        })
        .join('');
    }

    function search() {
      const q = normalize(input.value);
      if (!q) return render([], q);

      const terms = q.split(/\s+/).filter(Boolean);
      const matches = INDEX
        .map(item => {
          const matched = [];
          for (const t of terms) {
            if (item.keywords.some(k => k.includes(t) || t.includes(k))) {
              matched.push(t);
            }
          }
          return { ...item, score: matched.length, matched };
        })
        .filter(x => x.score > 0)
        .sort((a,b) => b.score - a.score)
        .slice(0, 10);

      render(matches, q);
    }

    btn.addEventListener('click', search);
    clearBtn.addEventListener('click', () => {
      input.value = '';
      render([], '');
      input.focus();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') search();
    });
  </script>
<script src="js/site.js"></script>
</body>
</html>
